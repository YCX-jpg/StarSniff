name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 2.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: version
        shell: pwsh
        run: |
          $version = "$env:VERSION".Trim()
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if (-not $version) { throw "没有版本号" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Verify source version matches tag
        shell: pwsh
        run: |
          $version = python -c "from resource_sniffer import __version__; print(__version__)"
          if ($version -ne "${{ steps.version.outputs.value }}") {
            throw "Tag/输入版本 ${{ steps.version.outputs.value }} 与代码版本 $version 不一致"
          }
          Write-Host "版本一致：$version"

      - name: Run self tests
        shell: pwsh
        run: python tests/selftest.py

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "runner 上没有 Inno Setup，开始安装"
            choco install innosetup -y --no-progress
          } else {
            Write-Host "已有 Inno Setup: $iscc"
          }

      - name: Build exe, zip, portable and setup
        shell: pwsh
        run: ./build_exe.ps1 -SkipTests

      - name: Package source zip
        shell: pwsh
        run: |
          # robocopy 的退出码 1 表示"复制成功"，在 Actions 的 $ErrorActionPreference=stop
          # 下会被当成失败，所以这里用纯 PowerShell 复制，不碰原生命令
          $ver = "${{ steps.version.outputs.value }}"
          $root = (Get-Location).Path
          $stageName = "StarSniff-$ver"
          $stage = Join-Path $root "dist/src/$stageName"
          New-Item -ItemType Directory -Force $stage | Out-Null

          $skipDirs = @('.git', 'dist', 'build', '__pycache__', '.pytest_cache', 'Releases', '_assets')
          $skipExt = @('.pyc', '.log')
          $skipFiles = @('config.json', 'StarSniff.log')

          $copied = 0
          Get-ChildItem -Force -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            $parts = $rel -split '[\\/]'
            if ($parts | Where-Object { $skipDirs -contains $_ }) { return }
            if ($skipExt -contains $_.Extension.ToLower()) { return }
            if ($skipFiles -contains $_.Name) { return }
            $dest = Join-Path $stage $rel
            New-Item -ItemType Directory -Force (Split-Path -Parent $dest) | Out-Null
            Copy-Item $_.FullName $dest -Force
            $copied += 1
          }
          Write-Host "收集源码文件：$copied 个"

          $zip = Join-Path $root "dist/StarSniff-$ver-source.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  StarSniff-$ver-source.zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "源码包：$zip"
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarSniff-windows
          path: |
            dist/StarSniff-*-win64.zip
            dist/StarSniff-*-win64.zip.sha256
            dist/StarSniff-portable.exe
            dist/StarSniff-portable.exe.sha256
            dist/StarSniff-*-setup.exe
            dist/StarSniff-*-setup.exe.sha256
            dist/StarSniff-*-source.zip
            dist/StarSniff-*-source.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StarSniff ${{ steps.version.outputs.value }}
          files: |
            dist/StarSniff-*-win64.zip
            dist/StarSniff-*-win64.zip.sha256
            dist/StarSniff-portable.exe
            dist/StarSniff-portable.exe.sha256
            dist/StarSniff-*-setup.exe
            dist/StarSniff-*-setup.exe.sha256
            dist/StarSniff-*-source.zip
            dist/StarSniff-*-source.zip.sha256
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            ## StarSniff ${{ github.ref_name }}

            **推荐**：下载 `StarSniff-*-win64.zip`，解压后双击文件夹里的
            `StarSniff.exe`。目录版启动快，不依赖系统临时目录。

            其他文件：
            - `StarSniff-*-setup.exe`：安装程序，可选安装位置，装过再运行即原地更新
            - `StarSniff-portable.exe`：单文件便携版（会解压到 %TEMP%，个别杀软会拦）
            - `StarSniff-*-source.zip`：源码包，想自己改/自己打包用
            - `*.sha256`：校验值，`certutil -hashfile 文件 SHA256` 核对

            官网会**自动指向最新版本**，不用改页面。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
