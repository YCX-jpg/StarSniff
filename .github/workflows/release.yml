name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 2.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version
        id: version
        shell: pwsh
        run: |
          $version = "$env:VERSION".Trim()
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if (-not $version) { throw "没有版本号" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Verify source version matches tag
        shell: pwsh
        run: |
          $version = python -c "from resource_sniffer import __version__; print(__version__)"
          if ($version -ne "${{ steps.version.outputs.value }}") {
            throw "Tag/输入版本 ${{ steps.version.outputs.value }} 与代码版本 $version 不一致"
          }
          Write-Host "版本一致：$version"

      - name: Run self tests
        shell: pwsh
        run: python tests/selftest.py

      - name: Build exe and zip
        shell: pwsh
        run: ./build_exe.ps1 -SkipTests

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarSniff-windows
          path: |
            dist/StarSniff-*-win64.zip
            dist/*.sha256
            dist/StarSniff-portable.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StarSniff-*-win64.zip
            dist/StarSniff-*-win64.zip.sha256
            dist/StarSniff-portable.exe
            dist/StarSniff-portable.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## StarSniff 星嗅 ${{ github.ref_name }}

            **推荐**：下载 `StarSniff-*-win64.zip`，解压后双击文件夹里的
            `StarSniff.exe`。目录版启动快，不依赖系统临时目录。

            也可以下载单文件 `StarSniff-portable.exe`，首次启动会解压、稍慢；
            如果遇到杀毒软件拦截或“无法创建临时目录”，请改用 zip 目录版。

            校验文件：`*.sha256`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
